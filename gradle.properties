# --- Android Performance & Optimization ---
# Enable the most aggressive R8 optimizations (Full Mode)
android.enableR8.fullMode=true
# Speed up the build and reduce APK size further
android.r8.optimizedResourceShrinking=true
# Ensure native libs are handled correctly for Android TV
android.useAndroidX=true
android.enableJetifier=false

# --- Build Speed & Memory ---
# Parallel builds to speed up GitHub Actions
org.gradle.parallel=true
org.gradle.caching=true
# Increase memory for the compiler (Crucial for R8 Full Mode)
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Enable non-transitive R-classes to speed up compilation
android.nonTransitiveRClass=true

# --- Kotlin Settings ---
# Enable incremental compilation for faster builds
kotlin.incremental=true
kotlin.code.style=official
# KSP specific optimization
ksp.incremental=true
