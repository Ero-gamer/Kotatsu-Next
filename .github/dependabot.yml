version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # AGP 9 migration pending: Dagger/Hilt >= 2.59 and androidx.hilt >= 1.4 require it.
      - dependency-name: "com.google.dagger:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.hilt:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: "cargo"
    directory: "/app/src/main/rust/ssivcodecs"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
