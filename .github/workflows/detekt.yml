name: detekt (manual)

# detekt has no safe auto-fix for its own rules (only the separate detekt-formatting plugin can
# rewrite code, and it duplicates ktlint), so this workflow only reports.
on:
  workflow_dispatch:

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: detekt
        run: ./gradlew detekt --no-daemon
