name: Debug2

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        # Adding --stacktrace so we can see exactly what's up if it fails
        # Using --no-build-cache to ensure the new library versions are picked up
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Kotatsu-Debug-Build
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
