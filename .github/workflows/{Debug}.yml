name: Debug

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Strip Non-English Strings
        # Deletes all translations except default and dark mode
        run: |
          find app/src/main/res -type d -name "values-*" ! -name "values" ! -name "values-night" -exec rm -rf {} +
          echo "Languages stripped."

      - name: Build Debug APK
        # Ensure this is 'assembleDebug'
        run: ./gradlew clean assembleDebug --no-daemon --parallel

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Kotatsu-Debug-Build
          # PATH FIXED: changed 'release' to 'debug'
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
