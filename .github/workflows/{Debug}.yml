name: Debug2

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Strip Non-English Strings
        # This command finds all directories starting with 'values-' 
        # but EXCLUDES the 'values' (default) and 'values-night' (theme) folders.
        run: |
          find app/src/main/res -type d -name "values-*" ! -name "values" ! -name "values-night" -exec rm -rf {} +
          echo "Non-English language folders removed."

      - name: Build Debug APK
        # We run 'clean' to ensure the resource merger doesn't see the deleted files
        run: ./gradlew clean assembleDebug --no-daemon --parallel

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Kotatsu-Debug-Build
          path: app/build/outputs/apk/debug/*.apk
