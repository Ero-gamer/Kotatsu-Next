name: Debug2

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # Standard caching is safe now with updated libraries
          cache: 'gradle' 

      - name: Build Debug APK
        # We run 'clean' to ensure no old 'debug' configs linger
        # --no-build-cache ensures the APK is built fresh with new lib versions
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Kotatsu-Debug-Build
          path: app/build/outputs/apk/debug/*.apk
          # v7 allows faster uploads by adjusting compression
          compression-level: 6 
          if-no-files-found: error
