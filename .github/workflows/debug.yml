name: Debug Crash Investigation

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level for emulator'
        required: false
        default: '30'
        type: choice
        options: ['28', '29', '30', '31', '33', '34']
      launch_wait_seconds:
        description: 'Seconds to wait after app launch before collecting logs'
        required: false
        default: '30'

jobs:
  debug:
    runs-on: ubuntu-latest
    # Hardware acceleration for the emulator requires a larger runner on GitHub-hosted.
    # ubuntu-latest has KVM support so this works without macos runners.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-version: wrapper

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.testInstrumentationRunnerArguments.package=org.koitharu.kotatsu \
            2>&1 | tee build-debug.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── Emulator setup ────────────────────────────────────────────────────────

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ github.event.inputs.api_level }}-x86_64-v1

      - name: Create AVD and generate snapshot (if cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ github.event.inputs.api_level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "AVD snapshot created"

      # ── Launch, install, run, collect ─────────────────────────────────────────

      - name: Run app and collect crash logs
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ github.event.inputs.api_level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e

            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
            echo "Installing APK: $APK"
            adb install -r "$APK"

            echo "Clearing any previous logcat..."
            adb logcat -c

            echo "Launching app..."
            # Launch the Explore activity (first screen, where crash occurs)
            adb shell am start -n io.github.kotatsu.next.debug/org.koitharu.kotatsu.main.ui.MainActivity \
              --activity-clear-top

            echo "Waiting ${{ github.event.inputs.launch_wait_seconds }} seconds for crash to manifest..."
            sleep ${{ github.event.inputs.launch_wait_seconds }}

            echo "=== Collecting logcat (all levels, full buffer) ==="
            adb logcat -d -v threadtime '*:V' > logcat-full.txt 2>&1 || true

            echo "=== Filtering crash-relevant output ==="
            # Capture: crash, exception, ANR, fatal, kotatsu tag, CF-related
            grep -iE \
              "AndroidRuntime|FATAL EXCEPTION|E/kotatsu|W/kotatsu|CloudFlare|CaptchaHandler|WebView|ExploreViewModel|SuggestionsWorker|MangaSourcesRepository|beginning of crash|Process:.*died|ActivityManager.*crash|ANR in|Caused by:|at org\.koitharu\." \
              logcat-full.txt > logcat-crash.txt 2>/dev/null || true

            echo "=== Collecting ANR traces ==="
            adb shell "ls /data/anr/" 2>/dev/null | while read f; do
              adb shell "cat /data/anr/$f" >> anr-traces.txt 2>/dev/null || true
            done

            echo "=== Dumping app process info ==="
            adb shell "ps -A | grep kotatsu" > ps-output.txt 2>/dev/null || true

            echo "=== Checking if app process is still alive ==="
            PID=$(adb shell "pidof io.github.kotatsu.next.debug" 2>/dev/null || echo "")
            if [ -z "$PID" ]; then
              echo "APP CRASHED: process not found" | tee crash-verdict.txt
            else
              echo "App still running, PID=$PID" | tee crash-verdict.txt
              # Force a stack trace dump
              adb shell "kill -3 $PID" 2>/dev/null || true
              sleep 2
              adb shell "cat /data/anr/traces.txt" >> anr-traces.txt 2>/dev/null || true
            fi

            echo "=== DB / prefs state ==="
            adb shell "run-as io.github.kotatsu.next.debug ls -la /data/data/io.github.kotatsu.next.debug/databases/" \
              > db-state.txt 2>/dev/null || echo "Could not access app data dir" > db-state.txt

            echo "=== Line counts ==="
            wc -l logcat-full.txt logcat-crash.txt anr-traces.txt || true

      # ── Upload all artifacts ───────────────────────────────────────────────────

      - name: Upload crash logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crash-logs-api${{ github.event.inputs.api_level }}
          path: |
            logcat-full.txt
            logcat-crash.txt
            anr-traces.txt
            ps-output.txt
            crash-verdict.txt
            db-state.txt
            build-debug.log
          if-no-files-found: warn

      - name: Print crash summary to job log
        if: always()
        run: |
          echo "========================================"
          echo "CRASH VERDICT"
          echo "========================================"
          cat crash-verdict.txt 2>/dev/null || echo "(no verdict file)"
          echo ""
          echo "========================================"
          echo "CRASH EXCERPT (logcat-crash.txt, last 200 lines)"
          echo "========================================"
          tail -200 logcat-crash.txt 2>/dev/null || echo "(no crash log)"
