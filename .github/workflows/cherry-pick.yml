name: Merge Upstream Commit

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev2 branch
        uses: actions/checkout@v6
        with:
          ref: dev2
          fetch-depth: 0 # Fetch all history so git can find merge bases
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/Kotatsu-Redo/Kotatsu-Redo.git
          git fetch upstream eb2dd236d3f665d240aed2e3277c77b1d50a077b

      # OPTION A: Apply only the changes from that commit (Cherry-pick)
      #- name: Cherry-pick commit
      # run: |
      #   git cherry-pick eb2dd236d3f665d240aed2e3277c77b1d50a077b

      # OPTION B: Replace dev2 completely with that commit (Uncomment if needed, comment out Option A)
      - name: Hard reset to commit
         run: |
           git reset --hard eb2dd236d3f665d240aed2e3277c77b1d50a077b

      - name: Push changes
        run: |
          # Use --force if you chose Option B (Hard reset)
          git push origin dev2
