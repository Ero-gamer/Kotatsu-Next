name: Release2

on:
  push:
    branches: [ "devel" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Build armv7a Release
        # Filters for English-only resources AND forces 32-bit armv7a ABI
        run: ./gradlew assembleRelease -Pandroid.res.filter=en -Pandroid.injected.build.abi=armeabi-v7a --no-daemon
        env:
          RELEASE_STORE_FILE: ""
          RELEASE_STORE_PASSWORD: ""
          RELEASE_KEY_ALIAS: ""
          RELEASE_KEY_PASSWORD: ""

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Kotatsu-Next-armv7a
          path: app/build/outputs/apk/release/*.apk
