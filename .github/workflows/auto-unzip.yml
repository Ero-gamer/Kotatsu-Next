name: Unzip and Commit

on:
  push:
    paths:
      - '**.zip' # Triggers only when a zip file is uploaded

concurrency:
  group: unzip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the extracted files

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Extract zip
        run: |
          # Extract every root-level zip (overwriting existing files), then remove it
          found=0
          while IFS= read -r -d '' zip; do
            unzip -o -q "$zip" -d .
            rm -- "$zip"
            found=1
          done < <(find . -maxdepth 1 -name "*.zip" -print0)
          [ "$found" = 1 ] || echo "No zip found."

      - name: Stage Changes
        run: git add -A

      - name: Generate AI Commit Message
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, uuid

          # (model, lowest supported thinking level), newest first; the next one is only tried on failure
          MODELS = [
              ("gemini-3.8-flash", "low"),  # has no "minimal" level
              ("gemini-3.6-flash", "minimal"),
              ("gemini-3.5-flash-lite", "minimal"),
              ("gemini-3.1-flash-lite", "minimal"),
          ]
          MAX_DIFF_CHARS = 100_000
          FALLBACK = "Auto-extract: Code files updated from zip archive"


          def sh(cmd):
              return subprocess.run(cmd, capture_output=True, text=True).stdout


          def set_msg(msg):
              # Random delimiter so the message can never terminate the block early
              delim = f"EOF_{uuid.uuid4().hex}"
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"COMMIT_MSG<<{delim}\n{msg}\n{delim}\n")


          def ask(api_key, prompt):
              for model, level in MODELS:
                  payload = json.dumps({
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {"thinkingConfig": {"thinkingLevel": level}},
                  }).encode()
                  req = urllib.request.Request(
                      f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                      data=payload,
                      headers={"Content-Type": "application/json", "x-goog-api-key": api_key},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=90) as r:
                          text = json.load(r)["candidates"][0]["content"]["parts"][0]["text"].strip()
                      if text:
                          return text
                  except Exception as e:
                      print(f"Model {model} failed ({e}), trying next fallback...")
              return None


          api_key = os.environ.get("GEMINI_API_KEY", "")
          if not api_key:
              set_msg("Auto-extract: GEMINI_API_KEY secret is missing")
              raise SystemExit

          # Staged changes only, ignoring .zip archive deletions
          exclude = ["--", ".", ":(exclude)*.zip"]
          status = sh(["git", "diff", "--cached", "--name-status", *exclude]).strip()
          if not status:
              set_msg(FALLBACK)
              raise SystemExit
          patch = sh(["git", "diff", "--cached", "--stat", "-p", *exclude])[:MAX_DIFF_CHARS]

          prompt = (
              "Analyze the following git changes extracted from a zip archive. "
              "Provide a concise commit title (max 50 characters) summarizing the primary changes, "
              "followed by detailed bullet points describing important additions, refactors, or modifications across the source code files. "
              "Focus strictly on actual code changes and technical implementation details. "
              "Do NOT mention, summarize, or note the removal or deletion of any .zip archive file. "
              "Do not use markdown code blocks.\n\n"
              f"Changed Files Summary:\n{status}\n\n"
              f"Diff:\n{patch}"
          )
          set_msg(ask(api_key, prompt) or "Auto-extract: Code files updated from archive (API Unavailable)")
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "$COMMIT_MSG"
            git pull --rebase --autostash || true
            git push
          fi
