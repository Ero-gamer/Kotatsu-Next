name: Unzip and Commit

on:
  push:
    branches:
      - '**' # Triggers on any branch push

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Extract zip and commit changes
        run: |
          # 1. Locate the zip file (searching root directory)
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in root directory. Skipping execution."
            exit 0
          fi

          echo "Found target archive: $ZIP_FILE"

          # 2. Extract and clean up original archive
          unzip -o "$ZIP_FILE" -d .
          rm "$ZIP_FILE"

          # 3. Configure Git credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 4. Stage and verify changes before committing
          git add .

          if git diff --staged --quiet; then
            echo "No changes detected after extraction."
          else
            git commit -m "Auto-extract: Decompressed $(basename "$ZIP_FILE")"
            git push
          fi
