name: Unzip and Commit

on:
  push:
    paths:
      - '**.zip' # Triggers only when a zip file is uploaded

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the extracted files

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Extract zip
        run: |
          # Find the zip file
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            # Unzip, overwriting existing files
            unzip -o "$ZIP_FILE" -d .
            # Remove the zip file after extraction
            rm "$ZIP_FILE"
          fi

      - name: Stage Changes
        run: |
          git add .

      - name: Generate AI Commit Message
        id: ai_summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c '
          import os, subprocess, json, urllib.request, urllib.error

          def save_msg(text):
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("COMMIT_MSG<<EOF\n" + text + "\nEOF\n")

          api_key = os.environ.get("GEMINI_API_KEY", "")
          if not api_key:
              save_msg("Auto-extract: GEMINI_API_KEY secret is missing")
              exit(0)

          exclusions = [
              ":(exclude)*.zip", ":(exclude)*lock*", ":(exclude)*.lock",
              ":(exclude)*.min.*", ":(exclude)*.map", ":(exclude)*.svg",
              ":(exclude)*.png", ":(exclude)*.jpg", ":(exclude)*.jpeg",
              ":(exclude)*.gif", ":(exclude)*.webp", ":(exclude)*.ico",
              ":(exclude)*.woff*", ":(exclude)*.ttf", ":(exclude)*.pdf",
              ":(exclude)*.jar", ":(exclude)*.bin"
          ]
          excl_args = " ".join(f"\"{e}\"" for e in exclusions)

          diff_stat = subprocess.getoutput(f"git status --short -- . {excl_args}")
          full_patch = subprocess.getoutput(f"git diff --cached --stat -p -- . {excl_args}")

          if not diff_stat.strip():
              save_msg("Auto-extract: Code files updated from zip archive")
              exit(0)

          max_chars = 100000
          diff_patch = (
              full_patch[:max_chars] + "\n\n... [Diff truncated at 100,000 characters] ..."
              if len(full_patch) > max_chars else full_patch
          )

          prompt = (
              "Analyze the following git changes extracted from a zip archive. "
              "Provide a concise commit title (max 50 characters) summarizing the primary changes, "
              "followed by detailed bullet points describing important additions, refactors, or modifications across the source code files. "
              "Focus strictly on actual code changes and technical implementation details. "
              "Do NOT mention, summarize, or note the removal or deletion of any .zip archive file. "
              "Do not use markdown code blocks.\n\n"
              f"Changed Files Summary:\n{diff_stat}\n\n"
              f"Full Source Diff:\n{diff_patch}"
          )

          models = [
              "gemini-3.5-flash-lite",
              "gemini-3.6-flash",
              "gemini-3.8-flash",
              "gemini-3.1-flash-lite"
          ]
          msg = None

          for model in models:
              url = f"https://googleapis.com{model}:generateContent?key={api_key}"
              body = {"contents": [{"parts": [{"text": prompt}]}]}
              
              # Apply thinkingLevel only to 3.8-flash so Lite/3.6 models do not reject the payload
              if model == "gemini-3.8-flash":
                  body["generationConfig"] = {"thinkingConfig": {"thinkingLevel": "MINIMAL"}}

              payload = json.dumps(body).encode("utf-8")
              headers = {"Content-Type": "application/json"}

              try:
                  req = urllib.request.Request(url, data=payload, headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as response:
                      res_data = json.loads(response.read().decode("utf-8"))
                      msg = res_data["candidates"][0]["content"]["parts"][0]["text"].strip()
                      if msg:
                          print(f"Commit message generated using {model}")
                          break
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="ignore")
                  print(f"Model {model} failed with HTTP {e.code}: {err_body}")
              except Exception as e:
                  print(f"Model {model} failed with error: {e}")

          if not msg:
              msg = "Auto-extract: Code files updated from archive (API Unavailable)"

          save_msg(msg)
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
            git push
          else
            echo "No changes to commit."
          fi
