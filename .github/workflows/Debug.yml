name: Debug 2

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Clean Cache and Build Debug
        # Clean ensures no old UI indices or class files remain
        # assembleDebug provides the necessary logs to find the Gumlet crash
        run: ./gradlew clean assembleDebug -Pandroid.bundle.enableUncompressedNativeLibs=false

      - name: Upload ArmV7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Debug-ArmV7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
