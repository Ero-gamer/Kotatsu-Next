name: Debug 3

on:
  push:
    branches:
      - devel
      - devel2
  workflow_dispatch: # Important for manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # This ensures it fetches the specific branch you selected in the UI
          ref: ${{ github.event.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Clean and Build Debug
        # --no-daemon prevents Gradle 9.0 from hanging in CI environments
        # We also remove the uncompressedNativeLibs flag if it's causing deprecation errors
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload ArmV7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Debug-ArmV7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
