name: Debug 4

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Ensure we stay on the branch we actually want
          ref: ${{ github.event.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Disabling cache temporarily to clear any Gradle 9 leftovers
          cache: gradle

      - name: Force Gradle 8.1.3 Wrapper Permissions
        run: chmod +x gradlew

      - name: Clean and Build Debug
        # Using ./gradlew ensures it downloads 8.1.3 as defined in the properties file
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload ArmV7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Debug-ArmV7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
