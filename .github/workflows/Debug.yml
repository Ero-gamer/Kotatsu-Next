name: Debug 5

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix Wrapper Permissions
        run: chmod +x gradlew

      - name: Clean and Build Debug
        # Removed the problematic uncompressedNativeLibs flag
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload ArmV7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Debug-ArmV7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
