name: Debug

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # We disable the built-in cache to clear the bad property
          cache: '' 

      - name: Build Debug APK
        # --no-build-cache is the "nuke" option for that deprecated error
        run: ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload ArmV7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Debug-ArmV7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
