name: Revert Repo to Specific Commit

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetches all history so the target commit is available
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reset and Force Push to Commit
        run: |
          # Hard reset the local branch to your target commit
          git reset --hard ff24ee9483f139ba966dcb16257eacc7872942a2
          
          # Force push to overwrite the remote history
          git push origin ${{ github.ref_name }} --force
