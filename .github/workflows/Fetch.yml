name: Fetch Upstream Devel

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

# Set the target branch name here to keep everything in sync
env:
  TARGET_BRANCH: "devel2"

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Kotatsu-Next
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Create Branch
        run: |
          # 1. Add the upstream repo
          git remote add upstream https://github.com/kotatsu-redo/kotatsu-redo.git
          
          # 2. Fetch the specific 'devel' branch from upstream
          git fetch upstream devel
          
          # 3. Create/Reset the local branch to match upstream/devel
          # This uses the variable defined above
          git checkout -B ${{ env.TARGET_BRANCH }} upstream/devel

      - name: Push to Origin
        run: |
          # 4. Force push the new branch to your repository
          # This matches the local branch created in the previous step
          git push origin ${{ env.TARGET_BRANCH }} --force
