name: Fetch Upstream Devel

on:
  workflow_dispatch:

env:
  TARGET_BRANCH: "devel2"

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Note: Even with 'workflows: write', certain security restrictions apply.
      # Deleting the offending file is the cleanest way to bypass this.

    steps:
      - name: Checkout Kotatsu-Next
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Create Branch
        run: |
          git remote add upstream https://github.com/kotatsu-redo/kotatsu-redo.git
          git fetch upstream devel
          git checkout -B ${{ env.TARGET_BRANCH }} upstream/devel

      - name: Remove Restricted Workflow Files
        run: |
          # Remove the specific file causing the permission error
          rm -f .github/workflows/new-commit-discord.yml
          
          # Commit the deletion so the push is clean
          git add .github/workflows/new-commit-discord.yml
          git commit -m "Remove upstream Discord workflow to bypass permission restrictions" || echo "File already gone"

      - name: Push to Origin
        run: |
          git push origin ${{ env.TARGET_BRANCH }} --force
