name: Download Commit Files Only

on:
  workflow_dispatch:

jobs:
  download-files:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream repository
        uses: actions/checkout@v7
        with:
          repository: Kotatsu-Redo/Kotatsu-Redo
          fetch-depth: 0

      - name: Create ZIP of changed files only
        run: |
          COMMIT_SHA="c24bd1bb08613fd259acea19a07ff1dcba27867d"
          
          # 1. Log deleted files to the console and save them to a text file
          echo "=== DELETED FILES IN THIS COMMIT ==="
          git diff-tree --no-commit-id --name-only -r --diff-filter=D $COMMIT_SHA | tee deleted_files.txt
          echo "===================================="
          
          # 2. Get the list of added/modified files for the ZIP
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r --diff-filter=ACMRT $COMMIT_SHA)
          
          # 3. Create the ZIP archive
          if [ -z "$CHANGED_FILES" ]; then
            echo "No active files to archive (all changes were deletions)."
            # Archive just the log of deleted files
            git archive --format=zip --output=changed_files.zip HEAD deleted_files.txt
          else
            # Archive the active files
            git archive --format=zip --output=changed_files.zip $COMMIT_SHA $CHANGED_FILES
            
            # Add the deleted_files.txt into the existing ZIP archive for convenience
            zip -g changed_files.zip deleted_files.txt
          fi

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commit-changed-files
          path: changed_files.zip
          retention-days: 7
