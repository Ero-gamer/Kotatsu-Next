name: Download Commit Files Only

on:
  workflow_dispatch:

jobs:
  download-files:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream repository
        uses: actions/checkout@v6
        with:
          repository: Kotatsu-Redo/Kotatsu-Redo
          fetch-depth: 0

      - name: Create ZIP of changed files only
        run: |
          COMMIT_SHA="eb2dd236d3f665d240aed2e3277c77b1d50a077b"
          
          # Get list of changed files in that commit
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $COMMIT_SHA)
          
          # Create zip containing only those files
          git archive --format=zip --output=changed_files.zip $COMMIT_SHA $CHANGED_FILES

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commit-changed-files
          path: changed_files.zip
          retention-days: 7
