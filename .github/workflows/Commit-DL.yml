name: Download Commit Files Only

on:
  workflow_dispatch:

jobs:
  download-files:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream repository
        uses: actions/checkout@v6
        with:
          repository: Kotatsu-Redo/Kotatsu-Redo
          fetch-depth: 0

      - name: Create ZIP of changed files only
        run: |
          COMMIT_SHA="d4bb9aff61eec34929f13da999247f27827a1f4d"
          
          # Added --diff-filter=ACMRT to ignore Deleted (D) files
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r --diff-filter=ACMRT $COMMIT_SHA)
          
          # Check if there are any remaining files to archive (in case a commit ONLY deletes files)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files to archive (all files in this commit were deleted)."
            echo "Creating a dummy file so the archive step doesn't fail."
            touch deleted_only.txt
            git archive --format=zip --output=changed_files.zip $COMMIT_SHA deleted_only.txt
          else
            # Create zip containing only the existing files
            git archive --format=zip --output=changed_files.zip $COMMIT_SHA $CHANGED_FILES
          fi

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: commit-changed-files
          path: changed_files.zip
          retention-days: 7
