name: Spotless safe fix (manual)

# Runs Spotless (ktlint step) restricted to the layout-only rules in config/ktlint/safe.editorconfig,
# verifies the diff is layout-only, compiles, then opens a PR.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  KTLINT_VERSION: "1.8.0"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restrict ktlint (inside Spotless) to layout-only rules
        run: |
          {
            echo ""
            sed -n '/^\[\*\.{kt,kts}\]/,$p' config/ktlint/safe.editorconfig
          } >> .editorconfig

      - name: Spotless apply
        run: ./gradlew spotlessApply --no-daemon

      - name: Drop the temporary .editorconfig change
        run: git checkout -- .editorconfig

      - name: Verify the changes are layout-only
        run: python3 scripts/verify-safe-format.py

      - name: Compile check
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Open pull request with the fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Nothing to fix."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="ci/spotless-safe-fix-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A
          git commit -m "style: spotless safe layout fixes"
          git push origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "style: spotless safe layout fixes" \
            --body "Automated, manually triggered. Layout-only changes verified by scripts/verify-safe-format.py and a compile check. Review the diff before merging." \
            || echo "Could not open a PR automatically; branch '$branch' was pushed."
