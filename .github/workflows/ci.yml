name: Auto Spotless & Detekt

on:
  push:
    branches: [ "main", "master", "dev3" ]
  pull_request:
    branches: [ "main", "master", "dev3" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to auto-commit formatting changes back to the repo

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '21.0.13+100000002.0.LTS'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Step 1 - Spotless Auto-Format & Fix
        run: ./gradlew spotlessApply --no-daemon

      # Commit the formatting fixes BEFORE detekt, so they are kept even when detekt fails.
      - name: Step 2 - Auto-Commit Formatted/Cleaned Code
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "style(ci): auto-fix code formatting & lint issues [skip ci]"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: ${{ github.head_ref || github.ref_name }}

      # Report-only until a baseline exists (24 findings in existing code, maxIssues is 0): the run stays green
      # and the findings are in this step's log. Create a baseline with the "detekt" workflow, then remove this line.
      - name: Step 3 - Detekt Static Analysis
        continue-on-error: true
        run: ./gradlew detekt --no-daemon

  # Compile + Rust tests on every push/PR: catches compile breakers before a release build.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '21.0.13+100000002.0.LTS'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rust unit tests
        working-directory: app/src/main/rust/ssivcodecs
        run: cargo test --locked

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon
