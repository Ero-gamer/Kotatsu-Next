name: Android CI - Code Format, Lint & Auto-Fix

on:
  push:
    branches: [ "main", "master", "dev3" ]
  pull_request:
    branches: [ "main", "master", "dev3" ]

jobs:
  format-and-lint:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to auto-commit formatting changes back to the repo

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Step 1 - Spotless Auto-Format & Fix
        run: ./gradlew spotlessApply --no-daemon

      - name: Step 2 - Detekt Static Analysis
        run: ./gradlew detekt --no-daemon
        continue-on-error: false

      - name: Step 3 - Auto-Commit Formatted/Cleaned Code
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "style(ci): auto-fix code formatting & lint issues [skip ci]"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: ${{ github.head_ref || github.ref_name }}
