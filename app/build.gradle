import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.google.devtools.ksp)
    id 'kotlin-parcelize'
    alias(libs.plugins.hilt)
    alias(libs.plugins.room)
    alias(libs.plugins.serialization)
}

android {
    compileSdk = 36
    namespace = 'org.koitharu.kotatsu'

    defaultConfig {
        applicationId 'io.github.kotatsuredo.kotatsu'
        minSdk = 23
        targetSdk = 36
        versionCode = 2012
        versionName = '9.6.8'
        
        testInstrumentationRunner 'org.koitharu.kotatsu.HiltTestRunner'
        
        ksp {
            arg('room.generateKotlin', 'true')
        }

        // Standard NDK filter
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    // ABI Splitting: This generates the separate ARMv7a APK
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true 
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        nightly {
            initWith release
            applicationIdSuffix = '.nightly'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += [
            '-opt-in=kotlin.ExperimentalStdlibApi',
            '-opt-in=kotlinx.serialization.ExperimentalSerializationApi'
        ]
    }

    // Room 3.0 Schema Config
    room {
        schemaDirectory "$projectDir/schemas"
    }

    // Logic to fix ARMv7a APK building and Versioning
    def abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abiName = output.getFilter(com.android.build.OutputFile.ABI)
            def abiMultiplier = abiCodes.get(abiName, 0)

            if (variant.name == 'nightly') {
                def now = LocalDateTime.now()
                // Format: YYMMDD + ABI_ID
                output.versionCodeOverride = (now.format(DateTimeFormatter.ofPattern("yyMMdd")).toInteger() * 10) + abiMultiplier
                output.versionNameOverride = 'N' + now.format(DateTimeFormatter.ofPattern("yyyyMMdd"))
            } else {
                // Shift base version code to allow ABI suffix
                output.versionCodeOverride = (defaultConfig.versionCode * 10) + abiMultiplier
            }

            // Custom filename for the APK
            def name = abiName ?: "universal"
            outputFileName = "Kotatsu-${variant.versionName}-${name}.apk"
        }
    }
}

dependencies {
    // Parser override logic
    def parsersVersion = libs.versions.parsers.get()
    if (System.properties.containsKey('parsersVersionOverride')) {
        parsersVersion = System.getProperty('parsersVersionOverride')
    }
    implementation("com.github.clquwu:kotatsu-parsers-redo:$parsersVersion") {
        exclude group: 'org.json', module: 'json'
    }

    coreLibraryDesugaring libs.desugar.jdk.libs
    
    // Core AndroidX
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.activity
    implementation libs.androidx.fragment
    implementation libs.material

    // Room 3.0 (KSP is now mandatory)
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // Coil 3.4
    implementation libs.coil.core
    implementation libs.coil.network
    
    // ... add your other standard libs from the catalog
}
