plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    id "kotlin-parcelize"
    alias(libs.plugins.hilt)
    alias(libs.plugins.room)
    alias(libs.plugins.serialization)
}

android {
    compileSdk 36
    namespace 'org.koitharu.kotatsu'

    defaultConfig {
        applicationId 'io.github.kotatsuredo.kotatsu'
        minSdk 23
        targetSdk 36
        versionCode 2012
        versionName '9.6.8-AVIF-armv7a'
        
        testInstrumentationRunner 'org.koitharu.kotatsu.HiltTestRunner'
        
        ksp {
            arg('room.generateKotlin', 'true')
        }

        ndk {
            abiFilters.clear()
            abiFilters.add("armeabi-v7a")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Warning: Using debug config for release is only for testing!
            signingConfig signingConfigs.debug 
            
            packaging {
                jniLibs {
                    useLegacyPackaging = true 
                }
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += [
            '-opt-in=kotlin.ExperimentalStdlibApi',
            '-opt-in=kotlinx.serialization.ExperimentalSerializationApi'
        ]
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }
}

// Modern way to handle APK naming in Gradle 9.x / AGP 9.x
androidComponents {
    onVariants(selector().all(), { variant ->
        variant.outputs.forEach { output ->
            def abiMultiplier = 1
            output.versionCode.set((android.defaultConfig.versionCode * 10) + abiMultiplier)
            output.outputFileName.set("Kotatsu-Next-${android.defaultConfig.versionName}-armv7a.apk")
        }
    })
}

dependencies {
    implementation("com.github.clquwu:kotatsu-parsers-redo:master-SNAPSHOT") {
        exclude group: 'org.json', module: 'json'
    }

    implementation "io.github.awxkee:avif-coder:2.2.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.fragment

    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    implementation libs.hilt.android
    ksp libs.hilt.compiler

    implementation libs.coil.core
    implementation libs.coil.network
}
