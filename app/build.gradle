import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.devtools.ksp"
    id "kotlin-parcelize"
    id "com.google.dagger.hilt.android"
    id "androidx.room"
    id "org.jetbrains.kotlin.plugin.serialization"
}

android {
    compileSdk 36
    namespace 'org.koitharu.kotatsu'

    defaultConfig {
        applicationId 'io.github.kotatsuredo.kotatsu'
        minSdk 23
        targetSdk 36
        versionCode 2012
        versionName '9.6.8-AVIF-armv7a'
        
        testInstrumentationRunner 'org.koitharu.kotatsu.HiltTestRunner'
        
        ksp {
            arg('room.generateKotlin', 'true')
        }

        ndk {
            abiFilters.clear()
            abiFilters.add("armeabi-v7a")
        }
    }

    splits {
        abi { enable false }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug 
            
            packaging {
                jniLibs {
                    useLegacyPackaging = true 
                }
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += [
            '-opt-in=kotlin.ExperimentalStdlibApi',
            '-opt-in=kotlinx.serialization.ExperimentalSerializationApi'
        ]
    }

    // This block matches the 'androidx.room' plugin ID
    room {
        schemaDirectory "$projectDir/schemas"
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abiMultiplier = 1
            output.versionCodeOverride = (defaultConfig.versionCode * 10) + abiMultiplier
            outputFileName = "Kotatsu-Next-${variant.versionName}-armv7a.apk"
        }
    }
}

dependencies {
    // Standard Kotatsu-Redo Parsers
    implementation("com.github.clquwu:kotatsu-parsers-redo:master-SNAPSHOT") {
        exclude group: 'org.json', module: 'json'
    }

    // AVIF Decoder for your Xiaomi Box
    implementation "io.github.awxkee:avif-coder:2.2.0"

    // Core Library Desugaring (Matches your .toml version)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    
    // UI & Core
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.fragment

    // Room 3.0
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // Coil 3.4
    implementation libs.coil.core
    implementation libs.coil.network
}
