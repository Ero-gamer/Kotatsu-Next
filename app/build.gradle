import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

plugins {
    id libs.plugins.android.application.get().pluginId
    id libs.plugins.kotlin.android.get().pluginId
    id libs.plugins.google.devtools.ksp.get().pluginId
    id 'kotlin-parcelize'
    id libs.plugins.hilt.get().pluginId
    id libs.plugins.room.get().pluginId
    id libs.plugins.serialization.get().pluginId
}

android {
    compileSdk 36
    namespace 'org.koitharu.kotatsu'

    defaultConfig {
        applicationId 'io.github.kotatsuredo.kotatsu'
        minSdk 23
        targetSdk 36
        versionCode 2012
        versionName '9.6.8-AVIF-armv7a'
        
        testInstrumentationRunner 'org.koitharu.kotatsu.HiltTestRunner'
        
        ksp {
            arg('room.generateKotlin', 'true')
        }

        // HARD LOCK: Strictly limit to armv7a for Xiaomi Box performance
        ndk {
            abiFilters.clear()
            abiFilters.add("armeabi-v7a")
        }
    }

    // Disable splits - we are forcing a single targeted build
    splits {
        abi {
            enable false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Using 'proguard-android-optimize.txt' is required for R8 Full Mode
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            signingConfig signingConfigs.debug 
            
            packaging {
                jniLibs {
                    useLegacyPackaging = true 
                }
            }
        }
        nightly {
            initWith release
            applicationIdSuffix = '.nightly'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += [
            '-opt-in=kotlin.ExperimentalStdlibApi',
            '-opt-in=kotlinx.serialization.ExperimentalSerializationApi'
        ]
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }

    // Versioning logic optimized for single armv7a output
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abiMultiplier = 1 // Fixed for armv7a

            if (variant.name == 'nightly') {
                def now = LocalDateTime.now()
                output.versionCodeOverride = (now.format(DateTimeFormatter.ofPattern("yyMMdd")).toInteger() * 10) + abiMultiplier
                output.versionNameOverride = 'N' + now.format(DateTimeFormatter.ofPattern("yyyyMMdd"))
            } else {
                output.versionCodeOverride = (defaultConfig.versionCode * 10) + abiMultiplier
            }

            outputFileName = "Kotatsu-Next-${variant.versionName}-armv7a.apk"
        }
    }
}

dependencies {
    // Parser Logic
    def parsersVersion = libs.versions.parsers.get()
    implementation("com.github.clquwu:kotatsu-parsers-redo:$parsersVersion") {
        exclude group: 'org.json', module: 'json'
    }

    coreLibraryDesugaring libs.desugar.jdk.libs
    
    // Core Dependencies (Mapped from your Version Catalog)
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.activity
    implementation libs.androidx.fragment
    implementation libs.material

    // Database & DI
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // Image Loading + AVIF Decoder
    implementation libs.coil.core
    implementation libs.coil.network
    implementation "io.github.awxkee:avif-coder:2.2.0"
}
