import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.google.devtools.ksp)
    id 'kotlin-parcelize'
    alias(libs.plugins.hilt)
    alias(libs.plugins.room)
    alias(libs.plugins.serialization)
}

android {
    compileSdk = 36
    namespace = 'org.koitharu.kotatsu'

    defaultConfig {
        applicationId 'io.github.kotatsuredo.kotatsu'
        minSdk = 23
        targetSdk = 36
        versionCode = 2012
        versionName = '9.6.8-AVIF-armv7a' // Tagged for your specific build
        
        testInstrumentationRunner 'org.koitharu.kotatsu.HiltTestRunner'
        
        ksp {
            arg('room.generateKotlin', 'true')
        }

        // CRITICAL: Strictly limit to armv7a to keep APK small and fast
        ndk {
            abiFilters.clear()
            abiFilters.add("armeabi-v7a")
        }
    }

    // Disable splits because we are filtering at the NDK level for a single APK
    splits {
        abi {
            enable false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Using 'proguard-android-optimize.txt' is required for R8 Full Mode
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            signingConfig signingConfigs.debug // Uses debug key so you can install without setting up secrets
            
            packaging {
                jniLibs {
                    // Optimization: Keep symbols for your dav1d debugging but compress the libs
                    useLegacyPackaging = true 
                }
            }
        }
        nightly {
            initWith release
            applicationIdSuffix = '.nightly'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += [
            '-opt-in=kotlin.ExperimentalStdlibApi',
            '-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
            '-Xjvm-default=all' // Performance boost for interface calls
        ]
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }

    // Simplified armv7a versioning
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abiMultiplier = 1 // Fixed at 1 for armv7a

            if (variant.name == 'nightly') {
                def now = LocalDateTime.now()
                output.versionCodeOverride = (now.format(DateTimeFormatter.ofPattern("yyMMdd")).toInteger() * 10) + abiMultiplier
                output.versionNameOverride = 'N' + now.format(DateTimeFormatter.ofPattern("yyyyMMdd"))
            } else {
                output.versionCodeOverride = (defaultConfig.versionCode * 10) + abiMultiplier
            }

            outputFileName = "Kotatsu-Next-${variant.versionName}-armv7a.apk"
        }
    }
}

dependencies {
    // Force latest parsers
    def parsersVersion = libs.versions.parsers.get()
    implementation("com.github.clquwu:kotatsu-parsers-redo:$parsersVersion") {
        exclude group: 'org.json', module: 'json'
    }

    coreLibraryDesugaring libs.desugar.jdk.libs
    
    // Core Dependencies
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.activity
    implementation libs.androidx.fragment
    implementation libs.material

    // Room & Hilt
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // Coil 3.4 + Your added AVIF Coder
    implementation libs.coil.core
    implementation libs.coil.network
    implementation "com.github.awxkee:avif-coder:2.2.0" // Ensure this is in your catalog or add directly
}
