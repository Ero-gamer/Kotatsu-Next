[package]
name = "ssivcodecs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "JPEG XL and APNG decoders (region, downsample, animation) for Kotatsu / SubsamplingScaleImageView"
publish = false

[lib]
name = "ssivcodecs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["jxl", "apng"]
jxl = ["dep:jxl-oxide"]
apng = ["dep:png"]

[dependencies]
jni = "0.21"
jxl-oxide = { version = "0.12.6", default-features = false, features = ["rayon", "moxcms"], optional = true }
png = { version = "0.18", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1
