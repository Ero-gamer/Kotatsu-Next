[versions]
# Core Infrastructure
gradle = "9.1.0"
kotlin = "2.3.20"
ksp = "2.3.20-1.0.35"
dagger = "2.59.2"

# AndroidX & Lifecycle
activity = "1.13.0"
appcompat = "1.7.1"
biometric = "1.4.0"
collections = "1.5.0"
constraintlayout = "2.2.1"
coreKtx = "1.17.0"
fragment = "1.8.9"
lifecycle = "2.9.4"
room3 = "3.0.0"
workRuntime = "2.10.5"
window = "1.3.0"

# Networking & Media
coil = "3.4.0"
okhttp = "5.3.2"
okio = "3.16.4"
serialization = "1.10.0"
avifCoder = "2.2.0"
conscrypt = "2.5.2"

# Third Party & Tools
acra = "5.13.1"
adapterdelegates = "4.3.2"
desugar = "2.1.5"
hilt = "1.3.0"
markwon = "4.6.2"
material = "1.14.0-alpha05"
ssiv = "376930523c"

# Testing
junit = "4.13.2"
leakcanary = "3.0"

[libraries]
# (Note: Use the 'androidx.room3' group for Room 3.0)
androidx-room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room-ktx = { module = "androidx.room3:room3-ktx", version.ref = "room3" }
androidx-room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-room-testing = { module = "androidx.room3:room3-testing", version.ref = "room3" }

# Common AndroidX
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# Networking
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "dagger" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "dagger" }

[plugins]
android-application = { id = "com.android.application", version.ref = "gradle" }
# AGP 9.1 handles Kotlin via built-in support, but plugin ID is still used for KSP alignment
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
room = { id = "androidx.room3", version.ref = "room3" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
