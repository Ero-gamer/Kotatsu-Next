plugins {
    // In Groovy DSL, use 'libs.plugins.name.get().pluginId' 
    // or just 'id libs.plugins.xxx.get().pluginId'
    id libs.plugins.android.application.get().pluginId apply false
    id libs.plugins.kotlin.get().pluginId apply false
    id libs.plugins.hilt.get().pluginId apply false
    id libs.plugins.ksp.get().pluginId apply false
    id libs.plugins.room.get().pluginId apply false
    id libs.plugins.kotlinx.serialization.get().pluginId apply false
}

// Ensure repositories are defined for the whole project
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
